name: Publish Contracts Package

on:
  push:
    tags:
      - 'contracts-v*.*.*'

jobs:
  publish-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://npm.pkg.github.com'

      - name: Validate tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#contracts-v}"
          PACKAGE_VERSION=$(node -p "require('./contracts/package.json').version")
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match contracts/package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --prefix contracts

      - name: Generate contracts
        run: node contracts/scripts/generate-proto.js

      - name: Publish package
        run: npm publish --prefix contracts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
