name: Contract Check

on:
  pull_request:
    paths:
      - 'contracts/proto/**/*.proto'
      - 'contracts/proto/buf.yaml'
      - 'contracts/scripts/**'
      - 'package.json'

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1

      - name: Compatibility check
        run: |
          echo "Running protobuf contract checks..."
          node contracts/scripts/compatibility-check.js
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}

      - name: Governance policy check
        run: |
          echo "Running contract governance policy checks..."
          node contracts/scripts/governance-policy-check.js
        env:
          CONTRACT_BASE_REF: origin/${{ github.base_ref }}
