name: Contract Check

on:
  pull_request:
    paths:
      - 'contracts/proto/**/*.proto'
      - 'contracts/scripts/**'
      - 'package.json'

jobs:
  contracts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install contract dependencies only
        run: cd contracts && npm ci

      - name: Generate contracts
        run: cd contracts && npm run generate

      - name: Compatibility check
        run: cd contracts && npm run check
